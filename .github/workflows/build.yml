name: Auto Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          mkdir -p extracted
          unzip -o pixelshift-aod.zip -d extracted/
          if [ -d "extracted/pixelshift-aod" ]; then
            cp -rn extracted/pixelshift-aod/* .
          else
            cp -rn extracted/* .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK using Gradle Wrapper or System Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelShift-AOD-App
          path: "**/build/outputs/apk/debug/*.apk"
          
