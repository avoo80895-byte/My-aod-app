name: Auto Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files & Create Env
        run: |
          mkdir -p extracted
          unzip -o pixelshift-aod.zip -d extracted/
          if [ -d "extracted/pixelshift-aod" ]; then
            cp -rn extracted/pixelshift-aod/* .
            cp -rn extracted/pixelshift-aod/.* . 2>/dev/null || true
          else
            cp -rn extracted/* .
            cp -rn extracted/.* . 2>/dev/null || true
          fi
          # Create missing .env and .env.example files
          touch .env.example
          touch .env
          touch app/.env.example 2>/dev/null || true
          touch app/.env 2>/dev/null || true
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelShift-AOD-App
          path: "**/build/outputs/apk/debug/*.apk"
          
